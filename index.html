<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Barra</title>
<meta name="description" content="Tracker de calistenia con progresión automática">
<meta name="theme-color" content="#18252E">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Barra">
<link rel="preload" href="fonts/barlow-condensed-latin-800-normal.woff2" as="font" type="font/woff2" crossorigin>
<style>
@font-face{font-family:"Barlow Condensed";font-weight:600;font-display:swap;src:url(fonts/barlow-condensed-latin-600-normal.woff2) format("woff2")}
@font-face{font-family:"Barlow Condensed";font-weight:700;font-display:swap;src:url(fonts/barlow-condensed-latin-700-normal.woff2) format("woff2")}
@font-face{font-family:"Barlow Condensed";font-weight:800;font-display:swap;src:url(fonts/barlow-condensed-latin-800-normal.woff2) format("woff2")}
@font-face{font-family:"Barlow";font-weight:400;font-display:swap;src:url(fonts/barlow-latin-400-normal.woff2) format("woff2")}
@font-face{font-family:"Barlow";font-weight:600;font-display:swap;src:url(fonts/barlow-latin-600-normal.woff2) format("woff2")}

:root{
  --bg:#E6EAE8; --panel:#F6F8F7; --ink:#18252E; --muted:#5A6870; --line:#C7CFCC;
  --yellow:#F2C230; --yellow-ink:#18252E; --up:#2F7D4F; --down:#B3412E; --steel:#8FA0A8;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#121B21; --panel:#1B272F; --ink:#E6ECE9; --muted:#93A3AA; --line:#2E3D46;
  --up:#5DBB84; --down:#E07A63; --steel:#5E717B;}}
:root[data-theme="dark"]{--bg:#121B21; --panel:#1B272F; --ink:#E6ECE9; --muted:#93A3AA; --line:#2E3D46; --up:#5DBB84; --down:#E07A63; --steel:#5E717B;}
*,*::before,*::after{box-sizing:inherit}
html{height:100%; scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0; overscroll-behavior-y:none; min-height:100%; background:var(--bg); color:var(--ink);
  font-family:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif; font-size:17px; line-height:1.4;
  -webkit-tap-highlight-color:transparent}
button{font:inherit; color:inherit; cursor:pointer; border:0; background:none}
button:focus-visible,summary:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--yellow); outline-offset:2px}
.disp{font-family:"Barlow Condensed","Arial Narrow",system-ui,sans-serif}
main{max-width:560px; margin:0 auto; padding:14px 14px 150px}
header.top{display:flex; align-items:baseline; justify-content:space-between; gap:10px; padding:4px 2px 12px}
header.top h1{margin:0; font-family:"Barlow Condensed","Arial Narrow",sans-serif; font-weight:800; font-size:28px; letter-spacing:.5px}
.sync{font-size:13px; color:var(--muted)}
nav.tabs{position:fixed; left:0; right:0; bottom:0; z-index:20; background:var(--panel); border-top:1px solid var(--line);
  display:grid; grid-template-columns:repeat(4,1fr); padding-bottom:env(safe-area-inset-bottom,0px)}
nav.tabs button{padding:12px 4px 14px; font-weight:600; font-size:15px; color:var(--muted)}
nav.tabs button[aria-current="page"]{color:var(--ink); box-shadow:inset 0 3px 0 var(--yellow)}
h2{font-family:"Barlow Condensed","Arial Narrow",sans-serif; font-weight:700; font-size:22px; margin:22px 0 8px}
.muted{color:var(--muted)}
.small{font-size:14px}

/* Próximo entreno */
.next{background:var(--ink); color:var(--bg); border-radius:14px; padding:18px 18px 16px; margin-bottom:14px}
.next.live .kind{font-size:30px}
.next .kind{font-family:"Barlow Condensed",sans-serif; font-weight:800; font-size:44px; line-height:1; margin:2px 0 4px}
.next .sub{opacity:.8; font-size:15px}
.seq{display:flex; gap:5px; margin-top:12px}
.seq span{flex:1; height:6px; border-radius:3px; background:color-mix(in srgb,var(--bg) 25%,transparent)}
.seq span.on{background:var(--yellow)}
.seq span.done{background:color-mix(in srgb,var(--bg) 60%,transparent)}

.card{background:var(--panel); border:1px solid var(--line); border-radius:12px; margin:10px 0; overflow:hidden}
.card.done{opacity:.72}
.card-h{display:flex; gap:12px; align-items:flex-start; padding:14px; width:100%; text-align:left}
.pos{flex:none; width:34px; text-align:center}
.pos b{display:block; font-family:"Barlow Condensed",sans-serif; font-size:26px; line-height:1}
.pos small{font-size:11px; color:var(--muted)}
.card-h .name{font-weight:600; font-size:18px; line-height:1.2}
.card-h .meta{font-size:14px; color:var(--muted); margin-top:2px}
.tag{display:inline-block; font-size:12px; font-weight:600; padding:1px 7px; border-radius:20px; border:1px solid var(--line); color:var(--muted); margin-left:4px; vertical-align:1px}
.tag.prov{border-color:var(--down); color:var(--down)}
.streak{display:inline-flex; gap:3px; margin-left:6px; vertical-align:1px}
.streak i{width:8px; height:8px; border-radius:50%; background:var(--line)}
.streak i.up{background:var(--up)} .streak i.dn{background:var(--down)}

.body{padding:0 14px 16px}
.sets{display:flex; flex-wrap:wrap; gap:6px; margin:4px 0 12px; min-height:34px; align-items:center}
.chip{font-family:"Barlow Condensed",sans-serif; font-weight:700; font-size:20px; min-width:40px; height:34px; line-height:26px; padding:3px 10px; border-radius:8px; text-align:center; background:var(--bg); border:1px solid var(--line)}
.chip.hit{border-color:var(--up); color:var(--up)} .chip.miss{border-color:var(--down); color:var(--down)}
.chip.empty{color:var(--muted); border-style:dashed; font-weight:500}
.stepper{display:grid; grid-template-columns:72px 1fr 72px; align-items:center; gap:8px}
.stepper button.adj{height:72px; border-radius:12px; background:var(--bg); border:1px solid var(--line); font-size:34px; font-weight:600}
.big{text-align:center}
.big output{display:block; font-family:"Barlow Condensed",sans-serif; font-weight:800; font-size:72px; line-height:.95}
.big small{font-size:13px; color:var(--muted)}
.log{display:block; width:100%; margin-top:12px; height:66px; border-radius:12px; background:var(--yellow); color:var(--yellow-ink);
  font-family:"Barlow Condensed",sans-serif; font-weight:800; font-size:26px; letter-spacing:.3px}
.log:active{transform:translateY(1px)}
.row{display:flex; justify-content:space-between; align-items:center; gap:10px; margin-top:10px}
.link{color:var(--muted); font-size:15px; text-decoration:underline; text-underline-offset:3px; padding:6px 0}
.kg{display:flex; align-items:center; gap:8px; margin:2px 0 10px; font-size:15px}
.kg button{width:40px; height:36px; border-radius:8px; border:1px solid var(--line); background:var(--bg); font-size:20px}
.kg b{font-family:"Barlow Condensed",sans-serif; font-size:24px; min-width:62px; text-align:center}
details.tech{margin-top:10px; border-top:1px solid var(--line); padding-top:8px}
details.tech summary{font-weight:600; font-size:15px; padding:4px 0; cursor:pointer}
details.tech ul{margin:6px 0; padding-left:0; list-style:none}
details.tech li{padding:3px 0 3px 22px; position:relative; font-size:15px}
details.tech li::before{position:absolute; left:0; font-weight:700}
li.ok::before{content:"✓"; color:var(--up)} li.ko::before{content:"✗"; color:var(--down)} li.cr::before{content:"↑"; color:var(--ink)} li.nt::before{content:"i"; color:var(--muted); font-style:italic; left:4px}
details.tech a{color:var(--ink)}

.chk{display:flex; gap:10px; align-items:flex-start; padding:7px 0; font-size:15px}
.chk input{width:22px; height:22px; flex:none; margin-top:1px}
details.prep>summary{list-style:none; cursor:pointer}
details.prep>summary::-webkit-details-marker{display:none}
.primary{display:block; width:100%; height:60px; border-radius:12px; background:var(--ink); color:var(--bg); font-family:"Barlow Condensed",sans-serif; font-weight:700; font-size:24px; margin-top:16px}
.ghost{display:block; width:100%; height:50px; border-radius:12px; border:1px solid var(--line); background:transparent; font-weight:600; margin-top:10px}

/* Descanso */
.rest{position:fixed; left:0; right:0; bottom:calc(52px + env(safe-area-inset-bottom,0px)); z-index:19; background:var(--yellow); color:var(--yellow-ink);
  display:flex; align-items:center; gap:10px; padding:10px 14px; transform:translateY(120%); transition:transform .2s}
.rest.on{transform:none}
.rest .t{font-family:"Barlow Condensed",sans-serif; font-weight:800; font-size:44px; line-height:1; min-width:110px}
.rest .l{flex:1; font-size:14px; font-weight:600}
.rest button{height:44px; padding:0 12px; white-space:nowrap; border-radius:10px; border:2px solid var(--yellow-ink); font-weight:700}
.rest.end{background:var(--up); color:#fff} .rest.end button{border-color:#fff}

/* Escaleras */
.ladder{list-style:none; margin:0; padding:0 0 4px}
.ladder li{display:flex; align-items:center; gap:10px; border-left:3px solid var(--line); margin-left:10px; padding:0}
.ladder li button{flex:1; text-align:left; padding:9px 8px; font-size:15px; color:var(--muted)}
.ladder li::before{content:""; width:12px; height:3px; background:var(--line); margin-left:-3px}
.ladder li.past button{color:var(--ink)}
.ladder li.cur{border-left-color:var(--yellow)}
.ladder li.cur::before{background:var(--yellow); height:5px}
.ladder li.cur button{color:var(--ink); font-weight:700; font-size:17px}
.ladder li.past{border-left-color:var(--steel)}

/* Historial */
.hist{background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:12px 14px; margin:10px 0}
.hist h3{margin:0 0 6px; font-family:"Barlow Condensed",sans-serif; font-size:20px}
.hist table{width:100%; border-collapse:collapse; font-size:14px}
.hist td{padding:3px 0; vertical-align:top}
.hist td:last-child{text-align:right; font-family:"Barlow Condensed",sans-serif; font-size:17px; white-space:nowrap; padding-left:8px}
.chg{font-size:14px; margin-top:6px}
.chg .u{color:var(--up); font-weight:600} .chg .d{color:var(--down); font-weight:600}

/* Resultado */
dialog{border:0; border-radius:16px; padding:0; width:min(520px,92vw); background:var(--panel); color:var(--ink)}
dialog::backdrop{background:rgba(10,16,20,.55)}
.dlg{padding:20px}
.dlg h2{margin-top:0}
.res{list-style:none; padding:0; margin:0}
.res li{padding:10px 0; border-bottom:1px solid var(--line); font-size:15px}
.res li b{display:block; font-size:16px}
.res .u{color:var(--up)} .res .d{color:var(--down)}

label.f{display:block; margin:12px 0 4px; font-weight:600}
select,input[type=number],textarea{width:100%; font:inherit; color:var(--ink); background:var(--bg); border:1px solid var(--line); border-radius:10px; padding:10px}
textarea{min-height:120px; font-size:13px}
.empty{padding:24px 6px; color:var(--muted)}
@media (prefers-reduced-motion:reduce){.rest{transition:none}}
.shift{display:grid; grid-template-columns:1fr 1fr; gap:8px; margin:0 0 10px}
.shift button{height:44px; border-radius:10px; border:1px solid var(--line); background:var(--bg); font-weight:600; font-size:15px}
.shift button:disabled{opacity:.35; cursor:default}
.body.tight{padding-bottom:12px}
button.chip{cursor:pointer}
.chip.sel{background:var(--yellow); color:var(--yellow-ink); border-color:var(--yellow)}
.hint{margin-top:12px; padding:10px 12px; border-radius:10px; font-size:15px; border:1px solid var(--line)}
.hint.dn{border-color:var(--down)} .hint.up{border-color:var(--up)}
.hint button{display:block; margin-top:8px; height:40px; padding:0 14px; border-radius:8px; font-weight:700; background:var(--ink); color:var(--bg)}
.hh{display:flex; justify-content:space-between; align-items:baseline; gap:8px}
.toast{position:fixed; left:12px; right:12px; top:calc(10px + env(safe-area-inset-top,0px)); z-index:30; max-width:540px; margin:0 auto; background:var(--ink); color:var(--bg);
  border-radius:12px; padding:12px 14px; display:flex; align-items:center; justify-content:space-between; gap:10px; transform:translateY(-160%); transition:transform .2s; font-size:15px}
.toast.on{transform:none}
.toast button{color:var(--yellow); font-weight:700; padding:6px 4px; white-space:nowrap}
@media (prefers-reduced-motion:reduce){.toast{transition:none}}
</style>
<script src="app.js" defer></script>
</head>
<body>
<main id="app"></main>
<div class="rest" id="rest" role="timer" aria-live="off">
  <div class="t" id="restT">0:00</div>
  <div class="l" id="restL">Descanso</div>
  <button id="restPlus">+30 s</button>
  <button id="restSkip">Listo</button>
</div>
<nav class="tabs" id="tabs">
  <button data-tab="hoy">Entreno</button>
  <button data-tab="esc">Escaleras</button>
  <button data-tab="hist">Historial</button>
  <button data-tab="ajustes">Ajustes</button>
</nav>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<dialog id="dlg"><div class="dlg" id="dlgBody"></div></dialog>

</body>
</html>
